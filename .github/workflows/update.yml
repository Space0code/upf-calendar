name: Update UPF timetable

on:
  schedule:
    # Every 2 hours, roughly 06-22 Madrid time. GitHub often starts scheduled runs hours late or drops
    # some, so frequent slots keep the feed fresh. Repeat runs are harmless: no change means no commit
    # and no alert. Minute 7 avoids GitHub's busy top-of-hour queue.
    - cron: "7 4-20/2 * * *"
  workflow_dispatch: # manual run from the Actions tab

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 100 # up to 5 attempts, 15 minutes apart
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch timetable, diff, write feed
        env:
          UPF_URL: ${{ secrets.UPF_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          # Optional repository variables (Settings > Variables); defaults live in upf_calendar.py
          TERM_START: ${{ vars.TERM_START }}
          TERM_END: ${{ vars.TERM_END }}
          BASELINE_MODE: ${{ vars.BASELINE_MODE }}
          BASELINE_WEEK: ${{ vars.BASELINE_WEEK }}
          LAST_MINUTE_DAYS: ${{ vars.LAST_MINUTE_DAYS }}
        run: python3 upf_calendar.py

      - name: Commit updated feed and state
        if: success() || failure()
        run: |
          git config user.name "upf-calendar-bot"
          git config user.email "upf-calendar-bot@users.noreply.github.com"
          git add state.json docs/upf.ics
          git diff --cached --quiet || { git commit -m "Update timetable $(TZ=Europe/Madrid date '+%F %H:%M')" && git push; }

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # pick up the commit made by the sync job
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
