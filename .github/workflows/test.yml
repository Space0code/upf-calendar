name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main] # main gets bot data commits; no need to retest those

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Bot-owned files must not be changed
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^(state\.json|docs/upf\.ics)$'; then
            echo "::error::state.json and docs/upf.ics are written by the update workflow; remove them from this PR"
            exit 1
          fi
